<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snuumo Support — SSAMOK SOFT</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <meta name="description" content="Contact Snuumo support for help and security reports — SSAMOK SOFT." />
  <meta name="robots" content="index, follow" />
<link rel="stylesheet" href="/assets/css/styles.css" />
<style id="snuumo-legal-layout">
body[data-legal-doc^="snuumo_"] .legal {
  min-width: 0;
  padding-inline: clamp(16px, 4vw, 24px);
  overflow-wrap: anywhere;
}
body[data-legal-doc^="snuumo_"] .legal .doc-links > *,
body[data-legal-doc^="snuumo_"] .legal .back {
  min-width: 0;
  max-width: 100%;
}
body[data-legal-doc^="snuumo_"] .ti { display: none; }
body[data-legal-doc^="snuumo_"] .lang-symbol { width: 18px; height: 18px; }
</style>
</head>
<body data-legal-doc="snuumo_support" data-doc-links="privacy,terms,delete,support,impressum">
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="SSAMOK SOFT home">
        <span class="brand__mark" aria-hidden="true"></span>
        <span>SSAMOK SOFT</span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a class="nav__link" href="/#apps" data-i18n="nav.apps">Apps</a>
        <a class="nav__link" href="/#contact" data-i18n="nav.contact">Contact</a>
        <div class="lang" id="lang" aria-expanded="false">
          <button class="lang__toggle" id="lang-toggle" aria-haspopup="listbox"
                  data-i18n-attr="aria-label:nav.lang_aria">
            <svg class="lang-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
            <span id="lang-current">English</span>
            <span class="lang__chevron" aria-hidden="true">⌄</span>
          </button>
          <ul class="lang__menu" id="lang-menu" role="listbox"></ul>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <article class="container legal" id="legal-root"></article>
  </main>

  <footer class="site-footer">
    <div class="container footer__row">
      <div class="footer__links">
        <a href="/privacy/" data-i18n="footer.links.privacy">Privacy Policy</a>
        <a href="/#contact" data-i18n="footer.links.contact">Contact</a>
      </div>
      <p class="footer__meta">
        <span data-i18n="footer.rights">© 2026 SSAMOK SOFT. All rights reserved.</span>
      </p>
    </div>
  </footer>

  <script src="/assets/js/app.js" defer></script>
</body>
</html>
